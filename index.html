<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Muna</title>
  <meta name="description" content="Muna — a minimalist habit tracker you can share with friends.">
  <meta name="theme-color" content="#F6F5F8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Muna">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" href="fonts/lexend-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/lexend-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <script>try{var t=localStorage.getItem("muna.theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="splash"><div class="logo"></div></div>
  <div id="app"></div>
  <div id="layer"></div>
  <noscript>Muna needs JavaScript.</noscript>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
